name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "desktop/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/desktop-build.yml"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            command: npm run dist:mac
          - os: windows-latest
            name: Windows
            command: npm run dist:win
          - os: ubuntu-latest
            name: Linux
            command: npm run dist:linux

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm test

      - name: Build desktop package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: Ultimate-TV-OS-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
