name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "desktop/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/desktop-build.yml"

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            command: npm run dist:mac
          - os: windows-latest
            name: Windows
            command: npm run dist:win
          - os: ubuntu-latest
            name: Linux
            command: npm run dist:linux

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm test

      - name: Build desktop package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}

      - name: Verify macOS code signatures
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac/Ultimate TV OS.app"
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/Ultimate TV OS.app"
          codesign -dv --verbose=4 "release/mac-arm64/Ultimate TV OS.app" 2>&1 | grep -E "Signature=|TeamIdentifier=|Runtime Version=" || true

      - name: Upload macOS installers
        if: matrix.name == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-TV-OS-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-TV-OS-Windows
          path: release/*.exe
          if-no-files-found: error

      - name: Upload Linux packages
        if: matrix.name == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-TV-OS-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
