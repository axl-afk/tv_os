name: Runtime repository probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/runtime/**"
      - "package.json"
      - ".github/workflows/runtime-probe.yml"
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: runtime-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run runtime:probe
