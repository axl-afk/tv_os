<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate TV</title>
  <link rel="stylesheet" href="tv.css" />
</head>
<body>
  <div id="stage">
    <canvas id="frame" aria-label="Ultimate TV display"></canvas>
    <div id="boot">
      <div class="logo">ULTIMATE TV</div>
      <div class="spinner"></div>
      <p id="bootText">Connecting to Google TV…</p>
    </div>
  </div>

  <div id="controls" class="controls">
    <div>
      <strong>Ultimate TV</strong>
      <span id="surfaceStatus">Embedded TV mode</span>
    </div>
    <button id="exitBtn">Exit TV</button>
  </div>

  <script src="tv.js"></script>
</body>
</html>
