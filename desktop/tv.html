<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate TV</title>
  <link rel="stylesheet" href="tv.css" />
</head>
<body>
  <div id="stage">
    <canvas id="frame" aria-label="Ultimate TV display"></canvas>
    <div id="pairing" class="pairing hidden" aria-live="polite">
      <div class="pairing-label">Google TV Remote pairing code</div>
      <div id="pairingCode" class="pairing-code"></div>
      <div class="pairing-help">Enter this code in the Google TV app on your phone.</div>
    </div>
    <div id="boot">
      <div class="logo">ULTIMATE TV</div>
      <div class="spinner"></div>
      <p id="bootText">Connecting to Google TV…</p>
    </div>
  </div>

  <script src="tv.js"></script>
</body>
</html>
