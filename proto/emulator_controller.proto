// Minimal Apache-2.0-compatible subset of Android Emulator's
// emulator_controller.proto used by Ultimate TV OS.
// Upstream service: android.emulation.control.EmulatorController

syntax = "proto3";

package android.emulation.control;

service EmulatorController {
  rpc streamScreenshot(ImageFormat) returns (stream Image) {}
}

message ImageFormat {
  enum ImgFormat {
    PNG = 0;
    RGBA8888 = 1;
    RGB888 = 2;
  }

  ImgFormat format = 1;
  uint32 width = 3;
  uint32 height = 4;
  uint32 display = 5;
}

message Image {
  ImageFormat format = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes image = 4;
  uint32 seq = 5;
  uint64 timestampUs = 6;
}
